databases:
  - name: evaldb
    plan: free
    databaseName: evaldb
    user: evaluser

services:
  - type: web
    name: agent-eval-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: evaldb
          property: connectionString
      - key: SYNC_EVAL
        value: true
      - key: OLLAMA_BASE_URL
        value: ""
      - key: OLLAMA_MODEL
        value: llama3.2
      - key: SELF_UPDATER_MIN_OCCURRENCES
        value: 3
      - key: ANNOTATION_AUTO_LABEL_THRESHOLD
        value: 0.7
